<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The lines between build:meta are rewritten by `node build.js` from content.js
     (title, description, canonical, share tags). Everything else in this file is yours.
     You do not need to edit these by hand unless you never run the build. -->
<!-- build:meta -->
<title>Jeffrey Valeros | IT Support Specialist</title>
<meta name="description" content="IT support specialist in Daet, Philippines. I build systems where tests enforce the rules: a clinic stock ledger, an endpoint tracker and a security review CLI.">
<link rel="canonical" href="https://sketch-debug.github.io/portfolio/">
<meta property="og:type" content="website">
<meta property="og:title" content="Jeffrey Valeros | IT Support Specialist">
<meta property="og:description" content="IT support specialist in Daet, Philippines. I build systems where tests enforce the rules: a clinic stock ledger, an endpoint tracker and a security review CLI.">
<meta property="og:url" content="https://sketch-debug.github.io/portfolio/">
<meta property="og:image" content="https://sketch-debug.github.io/portfolio/images/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Jeffrey Valeros share image">
<meta name="twitter:card" content="summary_large_image">
<!-- /build:meta -->
<!-- Google Search Console: it gives you a tag like the one below to prove you own this
     site. Delete the example, paste your tag on its own line, and keep it outside the
     build:meta block above so `node build.js` never overwrites it. -->
<!-- <meta name="google-site-verification" content="paste-the-token-search-console-gives-you"> -->
<meta name="theme-color" content="#2438D9">

<!-- Favicon: drawn inline as SVG, so there is no extra file to load or lose. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230F1720'/%3E%3Crect%20x='8'%20y='17'%20width='4'%20height='7'%20rx='1'%20fill='%232438D9'/%3E%3Crect%20x='14'%20y='12'%20width='4'%20height='12'%20rx='1'%20fill='%23FFFFFF'/%3E%3Crect%20x='20'%20y='8'%20width='4'%20height='16'%20rx='1'%20fill='%235B6CFF'/%3E%3C/svg%3E">

<link rel="preload" href="fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app"></div>

<noscript>
  <div class="fatal">
    <h1>This site needs JavaScript</h1>
    <p>Please turn on JavaScript in your browser to see this portfolio.</p>
  </div>
</noscript>

<!-- If content.js has a typo (a missing comma or quote), show a friendly message instead of a blank page. -->
<script>
window.addEventListener('error', function (e) {
  var file = String(e.filename || '');
  if (file.indexOf('content.js') !== -1) {
    document.getElementById('app').innerHTML =
      '<div class="fatal"><h1>There is a typo in content.js</h1>' +
      '<p>The page could not read your content file. Open content.js and look near the last thing you changed. ' +
      'The usual causes are a missing comma at the end of a line, a missing quote mark, or a quote mark inside your text. ' +
      'See "If something breaks" in README.md.</p>' +
      '<p class="fatal__detail">' + String(e.message || '').replace(/</g, '&lt;') + '</p></div>';
  }
});
</script>

<script src="content.js"></script>
<script src="live.js"></script>
<script src="app.js"></script>
</body>
</html>
